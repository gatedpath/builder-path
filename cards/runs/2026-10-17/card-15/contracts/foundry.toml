# Foundry configuration for card-15 (scaffolded by create-redbelly-dapp 0.2.1).
# Network facts: https://vine.redbelly.network/consensus/evm-compatibility/ (Prague, solc 0.8.30).

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Both Redbelly networks run Prague and Vine states Solidity 0.8.30. Never go below cancun.
# Card 15: the vendored T-REX and ONCHAINID sources pin `pragma solidity 0.8.17;` exactly, and solc
# 0.8.17 knows neither prague nor cancun. The pin below is therefore per file: our own files say
# 0.8.30 in their pragma and get prague; the vendored files get 0.8.17 and the newest EVM that
# compiler knows (london), which is what the 44 registers on mainnet were built with.
# remappings.txt (no comments allowed there): the vendored packages are written for OpenZeppelin 4.x, so
# their @openzeppelin/* imports are remapped by context to the 4.9.6 copies under the oz4-* aliases.
auto_detect_solc = true
evm_version = "prague"
# Warnings in the vendored reference contracts are theirs, not ours; ours still fail the build.
ignored_warnings_from = ["node_modules/@tokenysolutions", "node_modules/@onchain-id", "node_modules/oz4-contracts", "node_modules/oz4-contracts-upgradeable"]
optimizer = true
optimizer_runs = 200
# Warnings are errors: an unused variable in a gated contract is a smell worth stopping for.
deny = "warnings"
# The deploy script reads ADMIN_SAFE and VERIFIER from the environment; never a key.
# Card 15 adds read access to out/: the vendored T-REX and ONCHAINID contracts are created from their
# compiled artifacts (vm.getCode), since a 0.8.30 script cannot import 0.8.17 sources.
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]
gas_reports = ["GatedExample", "Token", "IdentityRegistry", "GateReport", "ExpiringClaimIssuer"]

# forge lint runs on build. src/ is held to it; tests and scripts use patterns it flags on purpose
# (unchecked test transfers, small casts in fixtures).
[lint]
ignore = ["test/**/*", "script/**/*", "node_modules/**/*"]

[fuzz]
runs = 512
seed = "0x52424e54"   # fixed seed so CI gas diffs are comparable; remove to widen the search locally

[invariant]
runs = 64
depth = 32
fail_on_revert = false

# Chain 153. `forge script --rpc-url redbelly_testnet --account <keystore-name>`.
[profile.testnet]
eth_rpc_url = "https://governors.testnet.redbelly.network"
chain_id = 153

# Chain 151. The deploy script refuses this profile unless ADMIN_SAFE is a Safe 1.4.1 with
# threshold >= 2 and the deployer passes permission.isAllowed. Pre-flight first: `npm run preflight`.
[profile.mainnet]
eth_rpc_url = "https://governors.mainnet.redbelly.network"
chain_id = 151

[rpc_endpoints]
redbelly_testnet = "https://governors.testnet.redbelly.network"
redbelly_mainnet = "https://governors.mainnet.redbelly.network"
# A local fork: `anvil --fork-url https://governors.testnet.redbelly.network`
anvil = "http://127.0.0.1:8545"

# Routescan's Etherscan-style verification endpoints. The key is a fixed placeholder that
# Routescan documents as accepted; it is not a secret.
[etherscan]
redbelly_testnet = { key = "verifyContract", url = "https://api.routescan.io/v2/network/testnet/evm/153/etherscan", chain = 153 }
redbelly_mainnet = { key = "verifyContract", url = "https://api.routescan.io/v2/network/mainnet/evm/151/etherscan", chain = 151 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
