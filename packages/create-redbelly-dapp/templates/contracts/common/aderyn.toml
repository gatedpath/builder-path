# Aderyn configuration. Analyses src/ only; the test and script folders and dependencies are
# out of scope for its detectors.
version = 1
root = "."
src = "src/"
exclude = ["lib/", "node_modules/", "test/", "script/"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@gatedpath/receptor-mock/=lib/receptor-mock/src/",
  "@gatedpath/receptor-mock-test/=lib/receptor-mock/test/",
]
