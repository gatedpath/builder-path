# CI for __PROJECT_NAME__. Every action is pinned to a release tag. Jobs: build and test
# (unit, fuzz, invariant), Slither, Aderyn, a gas snapshot diff on pull requests, the rules-file
# drift check, and the web build. Nothing here holds a key or deploys anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_VERSION: v1.7.1

jobs:
  contracts:
    name: forge build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: foundry-rs/foundry-toolchain@v1.5.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Install pinned dependencies (OpenZeppelin from npm, forge-std at its tag)
        run: cd contracts && npm install --no-audit --no-fund && npm run install:forge-std
      - name: Build (warnings are errors)
        run: cd contracts && forge build --sizes
      - name: Unit, fuzz and invariant tests
        run: cd contracts && forge test -vvv
      - name: Format check
        run: cd contracts && forge fmt --check src script test

  gas-diff:
    name: forge snapshot --diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.base_ref }}
      - uses: foundry-rs/foundry-toolchain@v1.5.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Snapshot the base branch
        run: |
          cd contracts
          forge install foundry-rs/forge-std@v1.16.2 OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git
          forge snapshot --snap /tmp/base.gas-snapshot
      - uses: actions/checkout@v4.2.2
        with:
          clean: false
      - name: Diff this branch against the base
        run: |
          cd contracts
          forge install foundry-rs/forge-std@v1.16.2 OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git
          forge snapshot --diff /tmp/base.gas-snapshot

  slither:
    name: slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: foundry-rs/foundry-toolchain@v1.5.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: cd contracts && npm install --no-audit --no-fund && npm run install:forge-std
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          slither-version: 0.11.6
          fail-on: medium

  aderyn:
    name: aderyn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: foundry-rs/foundry-toolchain@v1.5.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: cd contracts && npm install --no-audit --no-fund && npm run install:forge-std
      - name: Run Aderyn (fails on high severity)
        run: cd contracts && npx --yes @cyfrin/aderyn@0.6.8 . --no-snippets
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: aderyn-report
          path: contracts/report.md
          if-no-files-found: ignore

  rules-files:
    name: agent rules files match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: node vendor/redbelly-agent-rules/dist/esm/cli.js --check --out . --only claude,agents,cursor,copilot,gemini
{{#if web}}

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
{{#if pnpm}}
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
{{/if}}
{{#unless pnpm}}
      - run: __PM_INSTALL__
      - run: __PM_RUN__ web:build
{{/unless}}
{{/if}}
